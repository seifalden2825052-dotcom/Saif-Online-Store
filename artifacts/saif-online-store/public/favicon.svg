<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <radialGradient id="surface" cx="30%" cy="12%" r="100%">
      <stop offset="0" stop-color="#33251f"/>
      <stop offset=".58" stop-color="#171210"/>
      <stop offset="1" stop-color="#090909"/>
    </radialGradient>
    <linearGradient id="copper" x1="27" y1="23" x2="100" y2="106" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffd0ad"/>
      <stop offset=".32" stop-color="#e9946d"/>
      <stop offset=".7" stop-color="#bb603f"/>
      <stop offset="1" stop-color="#75301f"/>
    </linearGradient>
    <linearGradient id="shine" x1="28" y1="32" x2="83" y2="91" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff0df"/>
      <stop offset="1" stop-color="#d57a56"/>
    </linearGradient>
    <filter id="softGlow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="2.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="128" height="128" rx="34" fill="url(#surface)"/>
  <rect x="7" y="7" width="114" height="114" rx="29" fill="none" stroke="#f5c3a1" stroke-opacity=".18" stroke-width="2"/>

  <!-- AUREN orbit: an open ring that reads as A at favicon scale -->
  <path d="M20 48C28 25 50 13 74 16c15 2 28 9 36 20" fill="none" stroke="url(#copper)" stroke-linecap="round" stroke-width="5" opacity=".9"/>
  <circle cx="111" cy="38" r="4.5" fill="#ffd0ad" filter="url(#softGlow)"/>

  <!-- Custom A monogram -->
  <path d="M28 95 57.5 29c2.2-5 9.2-5 11.4 0L98 95H82.5l-6.1-15.2H50L43.5 95H28Z" fill="url(#copper)" filter="url(#softGlow)"/>
  <path d="m63.2 46-8.7 22.1h17.4L63.2 46Z" fill="#171210"/>
  <path d="M48.5 73.5h29" stroke="url(#shine)" stroke-linecap="round" stroke-width="4"/>

  <!-- Small baseline cut for a more editorial wordmark feel -->
  <path d="M29 105h70" stroke="#f5c3a1" stroke-linecap="round" stroke-opacity=".5" stroke-width="2"/>
  <circle cx="22" cy="105" r="2" fill="#f5c3a1" opacity=".8"/>
</svg>